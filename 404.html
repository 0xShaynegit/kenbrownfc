    <title>404 - Page Not Found | Ken Brown FC</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1a1a1a;
            --accent: #ff6b35;
            --accent-light: #ffa550;
            --bg: #f5f5f5;
            --text-dark: #1a1a1a;
            --text-light: #666;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #efefef 100%);
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
            position: relative;
            z-index: 2;
        }

        .error-visual {
            position: relative;
            height: 200px;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-code {
            font-family: 'Courier New', monospace;
            font-size: 120px;
            font-weight: 900;
            color: var(--accent);
            line-height: 1;
            position: relative;
            letter-spacing: -2px;
            animation: slideInDown 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .error-code::before {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 4px;
            background: var(--accent-light);
            border-radius: 2px;
            animation: expandWidth 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s backwards;
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes expandWidth {
            from {
                width: 0;
            }
            to {
                width: 80%;
            }
        }

        h1 {
            font-family: 'Georgia', serif;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
            animation: fadeInUp 0.8s ease 0.2s backwards;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 16px;
            color: var(--text-light);
            margin-bottom: 32px;
            line-height: 1.6;
            animation: fadeInUp 0.8s ease 0.3s backwards;
        }

        .cta-button {
            display: inline-block;
            padding: 14px 40px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            border-radius: 4px;
            transition: all 0.3s ease;
            border: 2px solid var(--primary);
            animation: fadeInUp 0.8s ease 0.4s backwards;
            position: relative;
            overflow: hidden;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--accent);
            transition: left 0.3s ease;
            z-index: -1;
            border-radius: 4px;
        }

        .cta-button:hover {
            color: white;
            border-color: var(--accent);
        }

        .cta-button:hover::before {
            left: 0;
        }

        .secondary-link {
            display: block;
            margin-top: 24px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .secondary-link:hover {
            color: var(--accent);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Decorative elements */
        .decoration {
            position: fixed;
            pointer-events: none;
            opacity: 0.08;
            z-index: 1;
        }

        .circle-1 {
            top: -100px;
            right: -50px;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            animation: float 8s ease-in-out infinite;
        }

        .circle-2 {
            bottom: -80px;
            left: -40px;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            animation: float 10s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(20px);
            }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .error-code {
                font-size: 80px;
            }

            h1 {
                font-size: 24px;
            }

            p {
                font-size: 14px;
            }

            .cta-button {
                padding: 12px 32px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Decorative elements -->
    <div class="decoration circle-1"></div>
    <div class="decoration circle-2"></div>

    <!-- Main content -->
    <div class="container">
        <div class="error-visual">
            <div class="error-code">404</div>
        </div>

        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>

        <a href="/" class="cta-button">Return to Home</a>
        <a href="/" class="secondary-link">← Back to Ken Brown FC</a>
    </div>
